<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Murmuration — a flock at dusk</title>
  <script type="module" crossorigin src="./assets/index-_uH75mCk.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DWNqQX-r.css">
</head>
<body class="panel-open">
  <canvas id="bg"></canvas>
  <canvas id="flock"></canvas>

  <button id="panelToggle" aria-label="Toggle controls" title="Toggle controls (H)">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>

  <aside id="panel">
    <header>
      <h1>Murmuration</h1>
      <p class="hint">Your cursor is a hawk — the flock scatters from it.<br>Space pauses · H hides the panel · R restarts.</p>
    </header>

    <div class="sliders">
      <div class="row">
        <label for="sCohesion">Cohesion<span id="vCohesion">0.55</span></label>
        <input type="range" id="sCohesion" min="0" max="1" step="0.01" value="0.55">
      </div>
      <div class="row">
        <label for="sSeparation">Separation<span id="vSeparation">0.42</span></label>
        <input type="range" id="sSeparation" min="0" max="1" step="0.01" value="0.42">
      </div>
      <div class="row">
        <label for="sSpeed">Speed<span id="vSpeed">0.55</span></label>
        <input type="range" id="sSpeed" min="0" max="1" step="0.01" value="0.55">
      </div>
      <div class="row">
        <label for="sCount">Flock size<span id="vCount">700</span></label>
        <input type="range" id="sCount" min="100" max="900" step="20" value="700">
      </div>
    </div>

    <div class="presets" id="presets">
      <button data-preset="murmuration" class="active">Murmuration</button>
      <button data-preset="knot">Knot</button>
      <button data-preset="scatter">Scatter</button>
      <button data-preset="rapids">Rapids</button>
    </div>

    <div class="actions">
      <button id="btnPause">Pause</button>
      <button id="btnRestart">Restart</button>
    </div>

    <footer id="stats">600 birds · 60 fps</footer>
  </aside>

</body>
</html>
