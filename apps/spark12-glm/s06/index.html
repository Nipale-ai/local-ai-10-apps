<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local LLM Speed Lab — Benchmark Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235b8cff'/%3E%3Cpolygon points='13 3 5 13.5 11.5 13.5 10.5 21 19 10.5 12.5 10.5 13 3' fill='white'/%3E%3C/svg%3E">
  <script type="module" crossorigin src="./assets/index-kZAERVBh.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DAFTQjvJ.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="currentColor" stroke="none"></polygon>
          </svg>
        </div>
        <div>
          <h1>Local LLM Speed Lab</h1>
          <p class="sub">Decode throughput of local AI models on home hardware</p>
        </div>
      </div>
      <div class="controls">
        <nav id="filter" class="seg" aria-label="Filter by memory class"></nav>
        <button id="theme" class="icon-btn" title="Toggle light / dark theme" aria-label="Toggle theme"></button>
      </div>
    </header>

    <main>
      <p id="context" class="context"></p>
      <section id="kpis" class="kpis" aria-label="Key numbers"></section>
      <section id="charts" class="grid" aria-label="Charts"></section>
      <section class="card table-card" aria-label="All runs">
        <header class="card-head">
          <div>
            <h2 class="card-title">All runs</h2>
            <p id="table-note" class="card-note"></p>
          </div>
        </header>
        <div class="table-wrap">
          <table id="table"></table>
        </div>
      </section>
    </main>

    <footer id="footer" class="footer"></footer>
  </div>
  <div id="tooltip" class="tooltip" hidden></div>
</body>
</html>
