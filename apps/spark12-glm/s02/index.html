<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home AI Lab — Night</title>
  <style>html,body{background:#05060a;height:100%;margin:0;padding:0;overflow:hidden}#app,canvas{width:100%;height:100%;display:block;position:fixed;inset:0}.hud{z-index:10;color:#cfd8e3;-webkit-user-select:none;user-select:none;pointer-events:none;font-family:ui-monospace,SF Mono,Menlo,Consolas,monospace;position:fixed;top:18px;left:20px}.hud h1{letter-spacing:.14em;text-transform:uppercase;margin:0;font-size:14px;font-weight:600}.hud p{opacity:.55;letter-spacing:.06em;margin:4px 0 0;font-size:11px}.toggle{z-index:10;letter-spacing:.1em;color:#cfd8e3;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);background:#141820b3;border:1px solid #ffffff2e;border-radius:999px;padding:8px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;transition:background .3s,color .3s,border-color .3s;position:fixed;top:16px;right:20px}.toggle:hover{background:#3c465acc}.toggle.night{color:#9fd8ff;border-color:#78b4ff66}.toggle.day{color:#ffd98f;border-color:#ffc87873}.vignette{z-index:5;pointer-events:none;background:radial-gradient(#0000 55%,#00000052 100%);position:fixed;inset:0}.fade{z-index:20;pointer-events:none;opacity:1;background:#000;transition:opacity 1.6s;position:fixed;inset:0}.hud,.toggle{opacity:0;transition:opacity 1.2s .8s}.ready .hud,.ready .toggle{opacity:1}.ready .fade{opacity:0}</style>
  <script type="module" crossorigin src="./assets/index-DRmaRMfT.js"></script>
</head>
<body>
  <div id="app"></div>
  <div class="vignette"></div>
  <div class="fade" id="fade"></div>
  <div class="hud">
    <h1>Home AI Lab</h1>
    <p>drag to orbit · scroll to zoom</p>
  </div>
  <button class="toggle night" id="toggle">☾ NIGHT</button>
  <script>
    const btn = document.getElementById('toggle');
    btn.addEventListener('click', () => window.APP.setNight(!window.APP.state().night));
    setInterval(() => {
      const night = window.APP.state().night;
      btn.textContent = night ? '☾ NIGHT' : '☀ DAY';
      btn.className = 'toggle ' + (night ? 'night' : 'day');
    }, 250);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.body.classList.add('ready');
    }));
  </script>
</body>
</html>
