<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darkroom · Photo Editor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%230e1013'/%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%2358a6ff' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='3.5' fill='%2358a6ff'/%3E%3C/svg%3E">
  <script type="module" crossorigin src="./assets/index-Bk9-He2B.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Cyi8w4Xm.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3.5" fill="currentColor"/>
        </svg>
        <span>Darkroom</span>
      </div>
      <div class="tb-group" id="historyGroup">
        <button id="btnUndo" class="tbtn" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Undo</span>
        </button>
        <button id="btnRedo" class="tbtn" title="Redo (Ctrl+Shift+Z)">
          <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H10a6 6 0 0 0 0 12h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Redo</span>
        </button>
      </div>
      <div class="tb-sep"></div>
      <div class="tb-group">
        <button id="btnRotL" class="tbtn icon" title="Rotate left (Shift+R)">
          <svg viewBox="0 0 24 24"><path d="M4 9h9a5 5 0 0 1 0 10H8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 5 4 9l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btnRotR" class="tbtn icon" title="Rotate right (R)">
          <svg viewBox="0 0 24 24"><path d="M20 9h-9a5 5 0 0 0 0 10h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m16 5 4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btnFlipH" class="tbtn icon" title="Flip horizontal (H)">
          <svg viewBox="0 0 24 24"><path d="M12 3v18" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M9 7 4 12l5 5V7Z" fill="currentColor"/><path d="m15 7 5 5-5 5V7Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </button>
        <button id="btnFlipV" class="tbtn icon" title="Flip vertical (V)">
          <svg viewBox="0 0 24 24"><path d="M3 12h18" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M7 9 12 4l5 5H7Z" fill="currentColor"/><path d="M7 15l5 5 5-5H7Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="tb-sep"></div>
      <div class="tb-group">
        <button id="btnCrop" class="tbtn" title="Crop (C)">
          <svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M2 6h14a2 2 0 0 1 2 2v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Crop</span>
        </button>
        <button id="btnSplit" class="tbtn" title="Before / after split (B) — hold Space for original">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4v16" stroke="currentColor" stroke-width="2"/><path d="M7 9h2M7 12h2M7 15h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M15 9h2M15 12h2M15 15h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".45"/></svg>
          <span>Before / After</span>
        </button>
      </div>
      <div class="tb-flex"></div>
      <button id="btnReset" class="tbtn" title="Reset all edits">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Reset</span>
      </button>
      <button id="btnExport" class="tbtn primary" title="Export as PNG (E)">
        <svg viewBox="0 0 24 24"><path d="M12 3v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 19h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Export PNG</span>
      </button>
    </header>

    <main id="workspace">
      <aside id="sidebar">
        <div class="side-scroll">
          <section class="panel" id="panelAdjust">
            <h2>Tone</h2>
            <div class="sliders" id="slidersTone"></div>
          </section>
          <section class="panel" id="panelEffects">
            <h2>Effects</h2>
            <div class="sliders" id="slidersEffects"></div>
          </section>
          <section class="panel">
            <h2>Presets</h2>
            <div class="presets" id="presetGrid"></div>
          </section>
        </div>
      </aside>

      <section id="stage">
        <div id="cropBar" class="hidden">
          <span class="cropbar-label">Aspect</span>
          <div class="chips" id="aspectChips"></div>
          <div class="crop-nums" id="cropNums">
            <label>X <input type="number" id="numX"></label>
            <label>Y <input type="number" id="numY"></label>
            <label>W <input type="number" id="numW"></label>
            <label>H <input type="number" id="numH"></label>
          </div>
          <div class="tb-flex"></div>
          <button id="btnCropCancel" class="tbtn small">Cancel</button>
          <button id="btnCropApply" class="tbtn primary small">Apply crop</button>
        </div>
        <div id="canvasArea">
          <div id="canvasWrap">
            <canvas id="view"></canvas>
            <div id="cropOverlay" class="hidden">
              <div id="cropRect">
                <div class="handle nw" data-h="nw"></div>
                <div class="handle n"  data-h="n"></div>
                <div class="handle ne" data-h="ne"></div>
                <div class="handle e"  data-h="e"></div>
                <div class="handle se" data-h="se"></div>
                <div class="handle s"  data-h="s"></div>
                <div class="handle sw" data-h="sw"></div>
                <div class="handle w"  data-h="w"></div>
              </div>
            </div>
            <div id="baLabels" class="hidden"><span class="ba before">Before</span><span class="ba after">After</span></div>
          </div>
        </div>
      </section>
    </main>

    <footer id="statusbar">
      <span id="stDims">—</span>
      <span class="st-sep"></span>
      <span id="stZoom">—</span>
      <span class="st-sep"></span>
      <span id="stHist">—</span>
      <span class="tb-flex"></span>
      <span class="hint"><kbd>Ctrl+Z</kbd> undo · <kbd>Ctrl+Shift+Z</kbd> redo · <kbd>R</kbd> rotate · <kbd>C</kbd> crop · <kbd>B</kbd> compare · <kbd>Space</kbd> original · <kbd>E</kbd> export</span>
    </footer>
  </div>
  <div id="toast" class="hidden"></div>
</body>
</html>
