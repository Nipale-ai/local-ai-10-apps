<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Workshop</title>
  <script type="module" crossorigin src="./assets/index-KDLk3pU7.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B9xwZM5k.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5-9 9"/></svg>
        <span>Photo Workshop</span>
      </div>
      <div class="actions">
        <button id="btn-undo" title="Undo (Ctrl+Z)">Undo</button>
        <button id="btn-redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
        <button id="btn-export">Export PNG</button>
      </div>
    </header>
    <main id="stage">
      <canvas id="canvas"></canvas>
    </main>
    <aside id="panel">
      <section>
        <h3>Brightness</h3>
        <input type="range" id="brightness" min="-100" max="100" value="0">
        <span id="brightness-val">0</span>
      </section>
      <section>
        <h3>Crop</h3>
        <div class="crop-row">
          <label>X <input type="number" id="crop-x" value="0"></label>
          <label>Y <input type="number" id="crop-y" value="0"></label>
        </div>
        <div class="crop-row">
          <label>W <input type="number" id="crop-w" value="800"></label>
          <label>H <input type="number" id="crop-h" value="600"></label>
        </div>
        <button id="btn-crop">Apply Crop</button>
      </section>
    </aside>
  </div>
</body>
</html>
