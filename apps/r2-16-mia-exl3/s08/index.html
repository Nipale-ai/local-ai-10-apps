<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Murmuration — a flock of birds at dusk</title>
  <script type="module" crossorigin src="./assets/index-B5mQGKyY.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DgDnsmTB.css">
</head>
<body>
  <canvas id="flock"></canvas>
  <canvas id="sky"></canvas>
  <div id="panel">
    <div class="title">Murmuration</div>
    <div class="row"><label for="cohesion">Cohesion</label><input type="range" id="cohesion" min="0" max="1" step="0.01" value="0.6"></div>
    <div class="row"><label for="separation">Separation</label><input type="range" id="separation" min="0" max="1" step="0.01" value="0.5"></div>
    <div class="row"><label for="speed">Speed</label><input type="range" id="speed" min="0" max="1" step="0.01" value="0.6"></div>
    <div class="row"><label for="count">Birds</label><input type="range" id="count" min="100" max="4000" step="50" value="600"></div>
    <div class="btns">
      <button id="pause">Pause</button>
      <button id="restart">Restart</button>
      <button id="hide">Hide controls</button>
    </div>
    <div class="presets">
      <button data-preset="murmur">Murmuration</button>
      <button data-preset="tight">Tight</button>
      <button data-preset="loose">Loose</button>
    </div>
  </div>
  <button id="show" class="hidden">Show controls</button>
</body>
</html>
