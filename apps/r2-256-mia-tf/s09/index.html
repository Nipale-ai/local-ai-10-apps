<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Studio — Print-ready invoices</title>
  <meta name="description" content="Fill in an invoice and get a beautifully typeset, print-ready A4 invoice — exact to the cent.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314305a'/%3E%3Ctext x='16' y='21' font-family='Georgia' font-size='14' fill='%23c9a227' text-anchor='middle'%3EAN%3C/text%3E%3C/svg%3E">
  <script type="module" crossorigin src="./assets/index-CZUOJCkj.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DXMOA6lu.css">
</head>
<body>
  <div id="app">
    <aside class="form-panel" id="form-panel">
      <div class="brand-row">
        <div class="brand-mark">AN</div>
        <div class="brand-text">
          <div class="brand-name">Invoice Studio</div>
          <div class="brand-sub">Print-ready A4 invoices</div>
        </div>
        <button id="print-btn" class="btn btn-primary" title="Open the print dialog to print or save as PDF">Print / PDF</button>
      </div>

      <div class="cards">
        <section class="card">
          <h2>Sender</h2>
          <div class="grid2">
            <div class="field span2"><label for="snd-name">Sender name</label><input id="snd-name" data-path="sender.name" type="text"></div>
            <div class="field span2"><label for="snd-tag">Tagline</label><input id="snd-tag" data-path="sender.tagline" type="text"></div>
            <div class="field span2"><label for="snd-addr">Address (one line per row)</label><textarea id="snd-addr" data-path="sender.address" rows="3"></textarea></div>
            <div class="field"><label for="snd-vat">VAT ID</label><input id="snd-vat" data-path="sender.vatId" type="text"></div>
            <div class="field"><label for="snd-email">Email</label><input id="snd-email" data-path="sender.email" type="text"></div>
            <div class="field"><label for="snd-phone">Phone</label><input id="snd-phone" data-path="sender.phone" type="text"></div>
          </div>
          <div class="tpl-actions">
            <button id="save-tpl" class="btn btn-ghost" title="Store the sender details in this browser as a reusable template">Save sender as template</button>
            <button id="load-tpl" class="btn btn-ghost" title="Load the sender template stored in this browser">Use template</button>
          </div>
          <span id="tpl-msg" class="tpl-msg" role="status"></span>
        </section>

        <section class="card">
          <h2>Customer</h2>
          <div class="grid2">
            <div class="field span2"><label for="cus-name">Customer name</label><input id="cus-name" data-path="customer.name" type="text"></div>
            <div class="field span2"><label for="cus-addr">Address (one line per row)</label><textarea id="cus-addr" data-path="customer.address" rows="3"></textarea></div>
          </div>
        </section>

        <section class="card">
          <h2>Invoice details</h2>
          <div class="grid2">
            <div class="field"><label for="inv-no">Invoice number</label><input id="inv-no" data-path="meta.number" type="text"></div>
            <div class="field"><label for="inv-date">Invoice date</label><input id="inv-date" data-path="meta.date" type="date"></div>
            <div class="field"><label for="terms">Payment terms</label><select id="terms">
              <option value="14">Due in 14 days</option>
              <option value="30">Due in 30 days</option>
              <option value="0">Payable immediately</option>
              <option value="custom">Custom due date</option>
            </select></div>
            <div class="field"><label for="due-date">Due date</label><input id="due-date" data-path="meta.due" type="date"></div>
          </div>
        </section>

        <section class="card">
          <h2>Line items</h2>
          <div id="items"></div>
          <button id="add-line" class="btn btn-ghost" title="Add an empty line item to the invoice">+ Add line</button>
        </section>

        <section class="card">
          <h2>Discount</h2>
          <div class="field"><label for="disc">Discount % (applies to all lines)</label><input id="disc" data-path="discount_pct" type="number" min="0" max="100" step="0.1"></div>
        </section>

        <section class="card summary-card" aria-label="Live totals">
          <div class="sum-row"><span>Net</span><b id="sum-net">€ 0.00</b></div>
          <div id="sum-rates"></div>
          <div class="sum-row"><span>VAT</span><b id="sum-vat">€ 0.00</b></div>
          <div class="sum-row sum-gross"><span>Gross</span><b id="sum-gross">€ 0.00</b></div>
        </section>
      </div>
    </aside>

    <main class="preview" id="preview">
      <div class="sheet-wrap"><div class="sheet-caption">A4 · 210 × 297 mm · print-ready</div><div class="sheet" id="sheet"><div id="invoice"></div></div></div>
    </main>
  </div>
</body>
</html>
