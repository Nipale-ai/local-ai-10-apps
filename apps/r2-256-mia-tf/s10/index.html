<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Workshop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23e8b34b'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23101114'/%3E%3C/svg%3E">
  <script type="module" crossorigin src="./assets/index-BVJGLCCy.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B7nUWjK-.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="10" stroke="#e8b34b" stroke-width="2"/>
        <circle cx="12" cy="12" r="4" fill="#e8b34b"/>
        <path d="M12 2v6M12 16v6M2 12h6M16 12h6" stroke="#e8b34b" stroke-width="1.4"/>
      </svg>
      <span>Photo <b>Workshop</b></span>
    </div>
    <div class="top-actions">
      <button id="btn-undo" class="btn" title="Undo (Ctrl+Z)" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 14 4 9l5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a6 6 0 0 1 0 12h-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Undo
      </button>
      <button id="btn-redo" class="btn" title="Redo (Ctrl+Y)" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="m15 14 5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H10a6 6 0 0 0 0 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Redo
      </button>
      <span class="vsep"></span>
      <button id="btn-split" class="btn" title="Before / After (B)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/><path d="M12 4v16" stroke="currentColor" stroke-width="2"/></svg>
        Before / After
      </button>
      <button id="btn-export" class="btn primary" title="Export PNG (E)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Export PNG
      </button>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <div class="panel">
        <h3>Adjust</h3>
        <div class="slider-row">
          <label for="sl-brightness">Brightness <output id="val-brightness">0</output></label>
          <input type="range" id="sl-brightness" min="-100" max="100" value="0">
        </div>
        <div class="slider-row">
          <label for="sl-contrast">Contrast <output id="val-contrast">0</output></label>
          <input type="range" id="sl-contrast" min="-100" max="100" value="0">
        </div>
        <div class="slider-row">
          <label for="sl-saturation">Saturation <output id="val-saturation">0</output></label>
          <input type="range" id="sl-saturation" min="-100" max="100" value="0">
        </div>
        <button id="btn-reset-adj" class="btn small">Reset adjustments</button>
      </div>

      <div class="panel">
        <h3>Histogram</h3>
        <canvas id="histo" width="216" height="72"></canvas>
      </div>

      <div class="panel">
        <h3>Filters</h3>
        <div id="filter-grid" class="filter-grid"></div>
      </div>

      <div class="panel">
        <h3>Transform</h3>
        <div class="btn-grid">
          <button id="btn-rot-ccw" class="btn small" title="Rotate 90° counter-clockwise (Shift+R)">↺ 90°</button>
          <button id="btn-rot-cw" class="btn small" title="Rotate 90° clockwise (R)">↻ 90°</button>
          <button id="btn-flip-h" class="btn small" title="Flip horizontal (H)">⇋ Flip H</button>
          <button id="btn-flip-v" class="btn small" title="Flip vertical (V)">⇅ Flip V</button>
        </div>
      </div>

      <div class="panel" id="cropPanel">
        <h3>Crop</h3>
        <button id="btn-crop" class="btn small wide">✂ Enter crop mode (C)</button>
        <div id="cropControls" hidden>
          <div class="aspect-row">
            <button class="btn tiny aspect" data-ar="free">Free</button>
            <button class="btn tiny aspect" data-ar="1">1:1</button>
            <button class="btn tiny aspect" data-ar="1.3333333">4:3</button>
            <button class="btn tiny aspect" data-ar="1.5">3:2</button>
            <button class="btn tiny aspect" data-ar="1.7777778">16:9</button>
          </div>
          <div class="num-grid">
            <label>X<input type="number" id="crop-x" min="0"></label>
            <label>Y<input type="number" id="crop-y" min="0"></label>
            <label>W<input type="number" id="crop-w" min="1"></label>
            <label>H<input type="number" id="crop-h" min="1"></label>
          </div>
          <div class="btn-grid">
            <button id="btn-crop-apply" class="btn small primary">Apply</button>
            <button id="btn-crop-cancel" class="btn small">Cancel</button>
          </div>
        </div>
      </div>

      <div class="panel shortcuts">
        <h3>Shortcuts</h3>
        <div class="keys">
          <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</span>
          <span><kbd>Ctrl</kbd>+<kbd>Y</kbd> redo</span>
          <span><kbd>R</kbd> rotate · <kbd>B</kbd> compare</span>
          <span><kbd>C</kbd> crop · <kbd>E</kbd> export · <kbd>F</kbd> fit</span>
          <span><kbd>Ctrl</kbd>+wheel zoom</span>
          <span><kbd>0</kbd> reset adjustments</span>
        </div>
      </div>
    </aside>

    <section id="stage">
      <div id="canvasWrap">
        <div id="canvasStack">
          <canvas id="view" width="800" height="600"></canvas>
          <div id="cropOverlay" hidden>
            <div id="cropSel">
              <div class="third t1"></div><div class="third t2"></div>
              <div class="third h1"></div><div class="third h2"></div>
              <div class="hd" data-h="nw"></div><div class="hd" data-h="n"></div><div class="hd" data-h="ne"></div>
              <div class="hd" data-h="w"></div><div class="hd" data-h="e"></div>
              <div class="hd" data-h="sw"></div><div class="hd" data-h="s"></div><div class="hd" data-h="se"></div>
            </div>
          </div>
          <div id="splitHandle" hidden><div class="grip"></div></div>
          <div id="splitLabelL" class="split-label" hidden>Before</div>
          <div id="splitLabelR" class="split-label" hidden>After</div>
        </div>
      </div>
      <footer id="statusbar">
        <span id="status-dims">—</span>
        <span id="zoomCtl">
          <button id="z-out" class="zbtn" title="Zoom out (−)">−</button>
          <button id="z-fit" class="zbtn wide-z" title="Fit to screen (F)">Fit</button>
          <button id="z-in" class="zbtn" title="Zoom in (+)">+</button>
          <span id="z-val" title="Click for 100%">100%</span>
        </span>
        <span id="status-step"></span>
        <span id="status-hint">Drag sliders for live preview · edits are non-destructive</span>
      </footer>
    </section>
  </main>

  <div id="toast" hidden></div>
</body>
</html>
