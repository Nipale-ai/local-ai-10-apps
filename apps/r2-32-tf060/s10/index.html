<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Workshop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235b8cff'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23fff'/%3E%3Cpath d='M6 26l7-8 5 5 4-4 4 7z' fill='%23fff'/%3E%3C/svg%3E">
  <script type="module" crossorigin src="./assets/index-FMBABPw7.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CnBrkeSs.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#5b8cff"/><circle cx="12" cy="12" r="4" fill="#fff"/><path d="M6 26l7-8 5 5 4-4 4 7z" fill="#fff"/></svg>
      <span>Photo&nbsp;Workshop</span>
    </div>
    <div class="top-actions">
      <button id="btnUndo" class="icon-btn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button id="btnRedo" class="icon-btn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      </button>
      <span class="vsep"></span>
      <button id="btnCompare" class="icon-btn" title="Before / after (B)" aria-label="Toggle before and after view">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><rect x="3" y="6" width="18" height="12" rx="2"/></svg>
      </button>
      <button id="btnCrop" class="icon-btn" title="Crop tool (C)" aria-label="Toggle crop tool">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v16a2 2 0 0 0 2 2h14"/><path d="M18 22V6a2 2 0 0 0-2-2H2"/></svg>
      </button>
      <span class="vsep"></span>
      <button id="btnOpen" title="Open an image from your computer">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
        <span>Open</span>
      </button>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button id="btnExport" class="accent" title="Export as PNG (E)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
        <span>Export PNG</span>
      </button>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar">
      <section class="panel" id="panelAdjust">
        <h2>Adjust</h2>
        <div class="slider-row" data-param="brightness">
          <div class="slider-head"><label for="slBrightness">Brightness</label><span class="val" id="valBrightness">0</span></div>
          <input type="range" id="slBrightness" min="-100" max="100" step="1" value="0" aria-label="Brightness">
        </div>
        <div class="slider-row" data-param="contrast">
          <div class="slider-head"><label for="slContrast">Contrast</label><span class="val" id="valContrast">0</span></div>
          <input type="range" id="slContrast" min="-100" max="100" step="1" value="0" aria-label="Contrast">
        </div>
        <div class="slider-row" data-param="saturation">
          <div class="slider-head"><label for="slSaturation">Saturation</label><span class="val" id="valSaturation">0</span></div>
          <input type="range" id="slSaturation" min="-100" max="100" step="1" value="0" aria-label="Saturation">
        </div>
        <canvas id="histogram" width="213" height="64" aria-label="Color histogram"></canvas>
      </section>

      <section class="panel">
        <h2>Filters</h2>
        <div class="filter-grid" id="filterGrid"></div>
      </section>

      <section class="panel">
        <h2>Transform</h2>
        <div class="btn-grid">
          <button class="tool-btn" id="btnRotL" title="Rotate left"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span>Rotate left</span></button>
          <button class="tool-btn" id="btnRotR" title="Rotate right"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span>Rotate right</span></button>
          <button class="tool-btn" id="btnFlipH" title="Flip horizontal"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M8 7 4 12l4 5"/><path d="m16 7 4 5-4 5"/></svg><span>Flip H</span></button>
          <button class="tool-btn" id="btnFlipV" title="Flip vertical"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/><path d="M7 8 12 4l5 4"/><path d="m7 16 5 4 5-4"/></svg><span>Flip V</span></button>
        </div>
      </section>

      <section class="panel" id="panelCrop">
        <h2>Crop</h2>
        <div class="chip-row" id="aspectRow">
          <button class="chip active" data-aspect="0">Free</button>
          <button class="chip" data-aspect="1">1:1</button>
          <button class="chip" data-aspect="1.3333">4:3</button>
          <button class="chip" data-aspect="1.5">3:2</button>
          <button class="chip" data-aspect="1.7778">16:9</button>
        </div>
        <div class="num-grid">
          <label>X<input type="number" id="crX" min="0" max="800" value="0"></label>
          <label>Y<input type="number" id="crY" min="0" max="600" value="0"></label>
          <label>W<input type="number" id="crW" min="1" max="800" value="800"></label>
          <label>H<input type="number" id="crH" min="1" max="600" value="600"></label>
        </div>
        <div class="btn-row">
          <button class="tool-btn" id="btnCropApply">Apply</button>
          <button class="tool-btn" id="btnCropClear">Clear</button>
        </div>
        <p class="hint" id="cropHint">C — edit on canvas</p>
      </section>

      <section class="panel">
        <button class="tool-btn ghost" id="btnReset">Reset all edits</button>
      </section>
    </aside>

    <main class="stage-wrap" id="stageWrap">
      <div class="stage" id="stage">
        <canvas id="beforeCanvas" width="800" height="600"></canvas>
        <canvas id="afterCanvas" width="800" height="600"></canvas>
        <div class="split-line" id="splitLine"><div class="split-handle"></div></div>
        <div class="badge badge-before">Before</div>
        <div class="badge badge-after">After</div>
        <div class="crop-overlay" id="cropOverlay" hidden>
          <div class="crop-shade" id="shadeT"></div>
          <div class="crop-shade" id="shadeB"></div>
          <div class="crop-shade" id="shadeL"></div>
          <div class="crop-shade" id="shadeR"></div>
          <div class="crop-rect" id="cropRect"><div class="crop-body" id="cropBody"></div></div>
          <div class="crop-handle" data-h="nw" style="left:0%;top:0%"></div>
          <div class="crop-handle" data-h="n"  style="left:50%;top:0%"></div>
          <div class="crop-handle" data-h="ne" style="left:100%;top:0%"></div>
          <div class="crop-handle" data-h="e"  style="left:100%;top:50%"></div>
          <div class="crop-handle" data-h="se" style="left:100%;top:100%"></div>
          <div class="crop-handle" data-h="s"  style="left:50%;top:100%"></div>
          <div class="crop-handle" data-h="sw" style="left:0%;top:100%"></div>
          <div class="crop-handle" data-h="w"  style="left:0%;top:50%"></div>
        </div>
      </div>
    </main>
  </div>

  <footer class="statusbar">
    <span id="stDims">—</span>
    <span id="stZoom" class="muted"></span>
    <span id="stStep" class="muted"></span>
    <span class="spacer"></span>
    <span id="stHint" class="muted"></span>
  </footer>

</body>
</html>
