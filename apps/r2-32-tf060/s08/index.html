<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Murmuration</title>
  <script type="module" crossorigin src="./assets/index-DSBBBOYN.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CxfONRQV.css">
</head>
<body>
  <canvas id="sky"></canvas>
  <canvas id="flock"></canvas>

  <div id="panel">
    <div class="head">
      <div>
        <h1>Murmuration</h1>
        <div class="sub">a starling flock at dusk</div>
      </div>
      <button id="hideBtn" title="Hide the control panel">Hide panel</button>
    </div>

    <label class="row">Cohesion
      <input type="range" id="cohesion" min="0" max="1" step="0.01" value="0.5">
      <span class="val" id="cohesionVal"></span>
    </label>
    <label class="row">Separation
      <input type="range" id="separation" min="0" max="1" step="0.01" value="0.5">
      <span class="val" id="separationVal"></span>
    </label>
    <label class="row">Speed
      <input type="range" id="speed" min="0" max="1" step="0.01" value="0.5">
      <span class="val" id="speedVal"></span>
    </label>
    <label class="row">Birds
      <input type="range" id="count" min="50" max="4000" step="50" value="1000">
      <span class="val" id="countVal"></span>
    </label>

    <div class="btns">
      <button id="pauseBtn">Pause</button>
      <button id="restartBtn">Restart</button>
    </div>

    <div class="presets">
      <button data-preset="dusk">Dusk</button>
      <button data-preset="tight">Tight ball</button>
      <button data-preset="scatter">Scatter</button>
      <button data-preset="storm">Storm</button>
    </div>

    <div class="stats"><span id="birdCount">1000</span> birds &middot; <span id="fps">60</span> fps</div>
  </div>

  <button id="showBtn" hidden>Show panel</button>

</body>
</html>
