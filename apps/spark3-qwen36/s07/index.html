  <title>How a Language Model Writes — One Word at a Time</title>
  <style>*,:before,:after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0f0f13;--surface:#1a1a24;--surface2:#24243a;--text:#e8e8f0;--text2:#9090a8;--accent:#6c63ff;--accent2:#ff6b9d;--accent3:#00d4aa;--gold:gold;--radius:12px}body{background:var(--bg);color:var(--text);min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif;line-height:1.5;overflow-x:hidden}#app{max-width:720px;margin:0 auto;padding:20px 16px 40px}.header{text-align:center;padding:32px 0 24px}.header h1{background:linear-gradient(135deg, var(--accent), var(--accent2));-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;margin-bottom:8px;font-size:clamp(1.3rem,4vw,1.8rem);font-weight:700}.header p{color:var(--text2);max-width:500px;margin:0 auto;font-size:.95rem}.sentence-box{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);justify-content:center;align-items:center;min-height:80px;margin:20px 0;padding:24px;display:flex;position:relative;overflow:hidden}.sentence-text{letter-spacing:.02em;text-align:center;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;font-size:clamp(1.2rem,3.5vw,1.6rem);font-weight:600;display:flex}.word{transition:all .4s cubic-bezier(.34,1.56,.64,1);display:inline-block}.word .cursor{background:var(--accent);vertical-align:middle;width:2px;height:1.1em;margin-left:2px;animation:1s step-end infinite blink;display:inline-block}@keyframes blink{50%{opacity:0}}.word.chosen{color:var(--gold);animation:.6s ease-out wordFly}@keyframes wordFly{0%{color:var(--accent2);transform:scale(1.4)}to{color:var(--gold);transform:scale(1)}}.step-info{flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin:16px 0 8px;display:flex}.step-label{color:var(--text2);font-size:.85rem;font-weight:500}.step-label strong{color:var(--accent)}.caption{background:var(--surface);border-left:3px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;color:var(--text2);margin:12px 0;padding:12px 16px;font-size:.9rem;line-height:1.6}.caption strong{color:var(--text)}.candidates-panel{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);margin:16px 0;padding:20px;position:relative}.candidates-title{text-transform:uppercase;letter-spacing:.1em;color:var(--text2);margin-bottom:16px;font-size:.8rem;font-weight:600}.bar-item{align-items:center;gap:10px;margin-bottom:10px;display:flex}.bar-token{min-width:60px;color:var(--text);text-align:right;flex-shrink:0;padding-right:4px;font-family:SF Mono,Fira Code,Consolas,monospace;font-size:.85rem;font-weight:600}.bar-token.is-chosen{color:var(--gold)}.bar-track{background:#ffffff0a;border-radius:6px;flex:1;height:28px;position:relative;overflow:hidden}.bar-fill{border-radius:6px;min-width:4px;height:100%;transition:width .6s cubic-bezier(.25,1,.5,1);position:relative}.bar-fill.chosen{background:linear-gradient(90deg, var(--gold), #fa0)}.bar-fill.not-chosen{background:linear-gradient(90deg, var(--accent), #8b83ff)}.bar-pct{min-width:48px;color:var(--text2);text-align:left;flex-shrink:0;font-family:SF Mono,Fira Code,Consolas,monospace;font-size:.8rem}.bar-pct.is-chosen{color:var(--gold);font-weight:700}.temp-control{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);margin:16px 0;padding:16px 20px}.temp-header{justify-content:space-between;align-items:center;margin-bottom:10px;display:flex}.temp-label{color:var(--text2);font-size:.85rem;font-weight:500}.temp-value{color:var(--accent);background:var(--surface2);border-radius:6px;padding:2px 10px;font-family:SF Mono,Fira Code,Consolas,monospace;font-size:.9rem;font-weight:700}input[type=range]{appearance:none;background:var(--surface2);cursor:pointer;border-radius:3px;outline:none;width:100%;height:6px}input[type=range]::-webkit-slider-thumb{appearance:none;background:var(--accent);border:3px solid var(--surface);cursor:pointer;border-radius:50%;width:22px;height:22px;transition:transform .15s;box-shadow:0 0 8px #6c63ff66}input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}input[type=range]::-moz-range-thumb{background:var(--accent);border:3px solid var(--surface);cursor:pointer;border-radius:50%;width:22px;height:22px;box-shadow:0 0 8px #6c63ff66}.temp-desc{color:var(--text2);margin-top:8px;font-size:.78rem;line-height:1.4}.controls{flex-wrap:wrap;justify-content:center;gap:12px;margin:20px 0;display:flex}.btn{cursor:pointer;border:none;border-radius:8px;padding:12px 28px;font-family:inherit;font-size:.95rem;font-weight:600;transition:all .2s}.btn:active{transform:scale(.97)}.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px #6c63ff4d}.btn-primary:hover{background:#7d75ff}.btn-primary:disabled{background:var(--surface2);color:var(--text2);box-shadow:none;cursor:not-allowed}.btn-secondary{background:var(--surface2);color:var(--text)}.btn-secondary:hover{background:#2e2e4a}.btn-secondary:disabled{opacity:.4;cursor:not-allowed}.btn-autoplay{background:var(--surface2);color:var(--accent3);border:1px solid var(--accent3)}.btn-autoplay:hover{background:#00d4aa1a}.btn-autoplay.active{background:var(--accent3);color:var(--bg)}.expert-toggle{text-align:center;margin:12px 0}.expert-toggle button{border:1px solid var(--surface2);color:var(--text2);cursor:pointer;background:0 0;border-radius:20px;padding:6px 16px;font-family:inherit;font-size:.78rem;transition:all .2s}.expert-toggle button:hover{border-color:var(--accent);color:var(--accent)}.expert-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.expert-layer{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);color:var(--text2);margin:12px 0;padding:16px 20px;font-size:.82rem;line-height:1.7;display:none}.expert-layer.visible{display:block}.expert-layer code{background:var(--surface2);color:var(--accent3);border-radius:4px;padding:1px 6px;font-family:SF Mono,Fira Code,Consolas,monospace;font-size:.8rem}.progress-dots{justify-content:center;gap:8px;margin:16px 0;display:flex}.dot{background:var(--surface2);border-radius:50%;width:10px;height:10px;transition:all .3s}.dot.active{background:var(--accent);transform:scale(1.2);box-shadow:0 0 8px #6c63ff80}.dot.done{background:var(--accent3)}.finished-msg{text-align:center;color:var(--accent3);padding:24px;font-size:1.1rem;font-weight:600}@media (width<=480px){#app{padding:12px 10px 30px}.header{padding:20px 0 16px}.sentence-box{min-height:60px;padding:16px}.candidates-panel{padding:14px}.bar-token{min-width:48px;font-size:.78rem}.bar-pct{min-width:40px;font-size:.75rem}.btn{padding:10px 20px;font-size:.88rem}}</style>
