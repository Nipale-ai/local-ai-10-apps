<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Studio — print-ready A4 invoices</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect width='44' height='44' rx='9' fill='%2317456e'/%3E%3Cpath d='M15 12v20' stroke='%23fff' stroke-width='3.6' stroke-linecap='round'/%3E%3Cpath d='M27 12 L16.5 22.5 M17.5 23.5 L28 32' stroke='%23fff' stroke-width='3.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <script type="module" crossorigin src="./assets/index-BimE-F2g.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-vzRDUXX6.css">
</head>
<body>
  <div id="app">
    <header class="appbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true">
          <rect width="44" height="44" rx="9" fill="#17456e"/>
          <path d="M15 12v20" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
          <path d="M27 12 L16.5 22.5 M17.5 23.5 L28 32" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">Invoice Studio</span>
        <span class="brand-badge">A4 · print-ready</span>
      </div>
      <div class="appbar-actions">
        <button id="btn-reset" class="btn ghost" type="button">Reset example</button>
        <button id="btn-print" class="btn primary" type="button">
          <svg class="btn-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h8v3.2H4z M2.5 6h11v4.5h-2.2v2.8H5.7V10.5H2.5z M5.7 7.6h4.6v1.3H5.7z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
          Print / Save as PDF
        </button>
      </div>
    </header>
    <div class="main">
      <aside class="pane-form">
        <section class="card">
          <h3>Sender</h3>
          <div class="field"><label for="f-sname">Company name</label><input id="f-sname" type="text"></div>
          <div class="field"><label for="f-sstreet">Address</label><input id="f-sstreet" type="text"></div>
          <div class="field"><label for="f-scity">City</label><input id="f-scity" type="text"></div>
          <div class="field"><label for="f-scontact">Contact</label><input id="f-scontact" type="text"></div>
          <div class="row-2">
            <div class="field"><label for="f-svat">VAT ID</label><input id="f-svat" type="text"></div>
            <div class="field"><label for="f-sbank">Bank</label><input id="f-sbank" type="text"></div>
          </div>
          <div class="field"><label for="f-siban">IBAN</label><input id="f-siban" type="text"></div>
          <div class="field"><label for="f-sbic">BIC</label><input id="f-sbic" type="text"></div>
          <div class="card-foot">
            <button id="btn-template" class="btn small" type="button">Save sender as template</button>
          </div>
        </section>
        <section class="card">
          <h3>Customer</h3>
          <div class="field"><label for="f-cname">Name</label><input id="f-cname" type="text"></div>
          <div class="field"><label for="f-cstreet">Address</label><input id="f-cstreet" type="text"></div>
          <div class="field"><label for="f-ccity">City</label><input id="f-ccity" type="text"></div>
        </section>
        <section class="card">
          <h3>Invoice</h3>
          <div class="row-2">
            <div class="field"><label for="f-number">Invoice no.</label><input id="f-number" type="text"></div>
            <div class="field"><label for="f-disc">Discount %</label><input id="f-disc" type="number" step="any" min="0" max="100"></div>
          </div>
          <div class="row-2">
            <div class="field"><label for="f-date">Invoice date</label><input id="f-date" type="date"></div>
            <div class="field"><label for="f-due">Due date</label><input id="f-due" type="date"></div>
          </div>
          <div class="field"><label for="f-project">Project</label><input id="f-project" type="text"></div>
          <div class="field"><label for="f-terms">Payment terms</label><input id="f-terms" type="text"></div>
        </section>
        <section class="card">
          <h3>Line items</h3>
          <div class="items-head">
            <span>Description</span><span>Qty</span><span>Unit €</span><span>VAT</span><span></span>
          </div>
          <div id="items"></div>
          <button id="btn-add" class="btn add" type="button">+ Add line</button>
        </section>
      </aside>
      <section class="pane-preview">
        <div class="pv-bar">
          <span class="pv-title">Live preview</span>
          <span class="pv-right">
            <span class="pv-gross" id="pv-gross">€ 0.00</span>
            <span class="pv-sep">·</span>
            <span class="pv-meta">A4 · one page</span>
            <span class="pv-sep">·</span>
            <span class="pv-zoom">
              <button id="zoom-out" class="zoom-btn" type="button" aria-label="Zoom out">−</button>
              <span id="zoom-label">100%</span>
              <button id="zoom-in" class="zoom-btn" type="button" aria-label="Zoom in">+</button>
            </span>
          </span>
        </div>
        <div class="pv-scroll" id="pv">
          <div class="sheet-frame" id="frame">
            <div class="sheet" id="sheet"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
