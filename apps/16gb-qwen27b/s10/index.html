<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Workshop</title>
  <script type="module" crossorigin src="./assets/index-DRsq7LIE.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-17nk-4rd.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.5-3h5L16 7"/><circle cx="12" cy="13.5" r="3.5"/></svg>
        <span>Photo Workshop</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)" disabled>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
        <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Shift+Z)" disabled>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
        </button>
        <span class="top-sep"></span>
        <button class="btn" id="btn-compare" title="Before / after split view">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          Compare
        </button>
        <button class="btn primary" id="btn-export" title="Export PNG (E)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
          Export PNG
        </button>
      </div>
    </header>

    <main>
      <div id="stage-wrap">
        <canvas id="stage"></canvas>
        <div id="crop-bar" class="crop-bar" hidden>
          <div class="aspect-group" id="aspect-group">
            <button data-aspect="0" class="active">Free</button>
            <button data-aspect="1">1:1</button>
            <button data-aspect="0.75">4:3</button>
            <button data-aspect="1.5">3:2</button>
            <button data-aspect="1.7778">16:9</button>
          </div>
          <span class="top-sep"></span>
          <button class="btn small" id="crop-apply">Apply</button>
          <button class="btn small" id="crop-cancel">Cancel</button>
        </div>
      </div>

      <aside class="panel">
        <section class="sec">
          <div class="sec-head"><h2>Adjust</h2><button class="link" id="btn-reset-adj" title="Reset all adjustments">Reset</button></div>
          <div class="slider-row">
            <label for="sl-brightness">Brightness</label>
            <div class="slider-line">
              <input type="range" id="sl-brightness" min="-100" max="100" step="1" value="0">
              <span class="val" id="v-brightness">0</span>
            </div>
          </div>
          <div class="slider-row">
            <label for="sl-contrast">Contrast</label>
            <div class="slider-line">
              <input type="range" id="sl-contrast" min="-100" max="100" step="1" value="0">
              <span class="val" id="v-contrast">0</span>
            </div>
          </div>
          <div class="slider-row">
            <label for="sl-saturation">Saturation</label>
            <div class="slider-line">
              <input type="range" id="sl-saturation" min="0" max="200" step="1" value="100">
              <span class="val" id="v-saturation">100</span>
            </div>
          </div>
        </section>

        <section class="sec">
          <div class="sec-head"><h2>Filters</h2></div>
          <div class="filter-grid" id="filter-grid"></div>
        </section>

        <section class="sec">
          <div class="sec-head"><h2>Transform</h2></div>
          <div class="transform-grid">
            <button class="tbtn" id="t-rotl" title="Rotate left (Shift+R)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              <span>Rotate left</span>
            </button>
            <button class="tbtn" id="t-rotr" title="Rotate right (R)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
              <span>Rotate right</span>
            </button>
            <button class="tbtn" id="t-fliph" title="Flip horizontal (F)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><line x1="12" y1="3" x2="12" y2="21" stroke-dasharray="3 3"/></svg>
              <span>Flip H</span>
            </button>
            <button class="tbtn" id="t-flipv" title="Flip vertical (Shift+F)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3"/><path d="M3 16v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><line x1="3" y1="12" x2="21" y2="12" stroke-dasharray="3 3"/></svg>
              <span>Flip V</span>
            </button>
          </div>
        </section>

        <section class="sec">
          <div class="sec-head"><h2>Crop</h2><button class="link" id="btn-crop-mode" title="Crop with drag handles (C)">Handles</button></div>
          <div class="crop-nums">
            <label>X<input type="number" id="n-crop-x" min="0" value="0"></label>
            <label>Y<input type="number" id="n-crop-y" min="0" value="0"></label>
            <label>W<input type="number" id="n-crop-w" min="1" value="800"></label>
            <label>H<input type="number" id="n-crop-h" min="1" value="600"></label>
          </div>
          <button class="btn wide" id="n-crop-apply">Apply crop</button>
        </section>
      </aside>
    </main>

    <footer class="statusbar">
      <span id="status-size">—</span>
      <span class="dot"></span>
      <span id="status-orig">—</span>
      <span class="dot"></span>
      <span id="status-step">history 0</span>
      <span class="spacer"></span>
      <span class="hint">Hold <b>H</b> to peek at the original &nbsp;·&nbsp; <b>Ctrl+Z</b> undo &nbsp;·&nbsp; <b>C</b> crop &nbsp;·&nbsp; <b>E</b> export</span>
    </footer>
  </div>
</body>
</html>
