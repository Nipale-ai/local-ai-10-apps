<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skyhop — a tiny jump-and-run</title>
  <script type="module" crossorigin src="./assets/index-BOWvQhVr.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DBpHprde.css">
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="hud-box left"><span class="hud-label">Score</span><span id="hud-score">000000</span></div>
      <div class="hud-box center" id="hud-level">MEADOW</div>
      <div class="hud-box right"><span class="hud-label">Lives</span><span id="hud-lives">♥ ♥ ♥</span></div>

      <div id="ov-title">SKYHOP</div>
      <div id="ov-sub">a tiny jump-and-run</div>
      <div id="ov-hint">Press <b>Enter</b> to start</div>
      <div id="ov-controls">← → or A D to run &nbsp;·&nbsp; Space / ↑ to jump</div>
    </div>
  </div>
